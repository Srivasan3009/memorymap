services:
  - type: web
    name: memorymap-ai
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: openrouter
      - key: OPENROUTER_MODEL
        value: openai/gpt-4o-mini
      - key: OPENROUTER_API_KEY
        sync: false